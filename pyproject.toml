[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-phish-guard"
version = "1.0.0"
description = "Scam and phishing detection for Indian digital payments: messages, links, UPI requests, QR codes, pages and APKs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.7,<1.8",  # the shipped URL and message models were pickled with 1.7
    "joblib>=1.3",
    "opencv-python-headless>=4.8,<5",  # QR decoding; tested with OpenCV 4
    "cryptography>=42",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "pandas>=2.0"]
realdata = ["pandas>=2.0"]  # train and realdata commands

[project.scripts]
phishguard = "phishguard.__main__:main"

[tool.setuptools]
packages = ["phishguard"]

[tool.setuptools.package-data]
phishguard = ["models/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["phishguard"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905", "E731"]  # Depends() defaults are FastAPI's idiom; zip(strict=) and named lambdas are style
