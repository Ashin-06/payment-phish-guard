<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Scam Check settings</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}label{display:block;margin-top:14px;font-weight:600}input{width:100%;padding:8px;font:inherit;margin-top:4px;box-sizing:border-box}button{margin-top:16px;padding:8px 16px;font:inherit;font-weight:600;border:0;border-radius:8px;background:#0f6fde;color:#fff;cursor:pointer}#saved{color:#11845b;margin-left:10px}</style>
</head>
<body>
<h1>Scam Check settings</h1>
<label for="api">Scanner API address</label>
<input id="api" placeholder="http://127.0.0.1:8006">
<label for="key">API key (only if the server requires one)</label>
<input id="key" type="password" autocomplete="off">
<button id="save">Save</button><span id="saved"></span>
<p>If you point the extension at a server other than localhost, also add that address to <code>host_permissions</code> in manifest.json.</p>
<script src="options.js"></script>
</body>
</html>
