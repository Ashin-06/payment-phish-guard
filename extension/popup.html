<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scam Check</title>
<style>
  body { width:340px; margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:#14181d; background:#fff; }
  @media (prefers-color-scheme: dark) { body { background:#151a20; color:#e6ebf1; } textarea { background:#0d1014; color:#e6ebf1; border-color:#28303a; } }
  main { padding:14px; }
  h1 { font-size:16px; margin:0 0 10px; }
  .page { padding:10px; border-radius:8px; background:rgba(127,127,127,.12); margin-bottom:12px; }
  .safe { color:#11845b; } .suspicious { color:#b36b00; } .dangerous { color:#c62828; }
  textarea { width:100%; box-sizing:border-box; min-height:90px; font:inherit; padding:8px; border:1px solid #e0e4e9; border-radius:8px; }
  button { margin-top:8px; font:inherit; font-weight:600; border:0; border-radius:8px; padding:8px 14px; background:#0f6fde; color:#fff; cursor:pointer; }
  ul { padding-left:18px; margin:6px 0 0; }
  .muted { color:#7a8491; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Scam Check</h1>
  <div class="page" id="page">Checking this page…</div>
  <textarea id="text" placeholder="Paste a message, link or UPI ID"></textarea>
  <button id="go">Check</button>
  <div id="out"></div>
  <p class="muted"><a href="options.html" target="_blank">Settings</a></p>
</main>
<script src="popup.js"></script>
</body>
</html>
